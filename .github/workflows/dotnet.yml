
name: .NET

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopbridge_test_db
          POSTGRES_USER: shopbridge_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U shopbridge_user -d shopbridge_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=shopbridge_test_db;Username=shopbridge_user;Password=${{ secrets.POSTGRES_PASSWORD }}"
      ConnectionStrings__LogsConnection: "Host=localhost;Port=5433;Database=shopbridge_test_logs_db;Username=shopbridge_user;Password=${{ secrets.POSTGRES_PASSWORD }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ShopBridge.sln

      - name: Build
        run: dotnet build ShopBridge.sln --no-restore

      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef --version 8.0.32

      - name: Create Logging Database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5433 -U shopbridge_user \
            -d shopbridge_test_db \
            -c "CREATE DATABASE shopbridge_test_logs_db;"

      - name: Update Database
        run: |
          dotnet ef database update \
            --project ShopBridge.Infra/ShopBridge.Infra.csproj \
            --startup-project ShopBridge.Api/ShopBridge.Api.csproj

      - name: Test
        run: dotnet test ShopBridge.sln --no-build --verbosity normal
